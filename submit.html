<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>투고하기 | WAVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo"><a href="index.html">빛청모 월간지 <span>WAVE</span></a></div>
  <nav>
    <a href="society.html">사회</a>
    <a href="culture.html">문화</a>
    <a href="interview.html">인터뷰</a>
    <a href="essay.html">에세이</a>
    <span class="auth-nav"></span>
  </nav>
</header>

<section class="submit-form">
  <h1>원고 투고</h1>

  <form id="submit-form">
    <label>카테고리</label>
    <select name="category" required>
      <option value="society">사회</option>
      <option value="culture">문화</option>
      <option value="interview">인터뷰</option>
      <option value="essay">에세이</option>
    </select>

    <label>제목</label>
    <input type="text" name="title" required>

    <label>작성자</label>
    <input type="text" name="author" required>

    <label>본문</label>
    <textarea name="body" rows="10" required></textarea>

    <button type="submit">제출하기</button>
  </form>
</section>

<script src="js/auth.js"></script>
<script src="data/articles.js"></script>
<script src="js/app.js"></script>
<script>
(function() {
  function todayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  document.getElementById('submit-form').onsubmit = function(e) {
    e.preventDefault();
    var form = e.target;
    var category = form.category.value;
    var title = form.title.value.trim();
    var author = form.author.value.trim();
    var body = form.body.value.trim();
    if (!title || !author || !body) return;
    var list = window.getArticles();
    var newId = window.getNextArticleId();
    list.push({
      id: newId,
      category: category,
      title: title,
      author: author,
      date: todayStr(),
      body: '<p>' + body.replace(/\n/g, '</p><p>') + '</p>',
      views: 0
    });
    window.saveArticles(list);
    location.href = 'article.html?id=' + newId + '&cat=' + category;
  };
})();
</script>
</body>
</html>
